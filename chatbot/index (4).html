<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AXA</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="chat">
    <header class="chat-header">
      <img src="images/avatar.svg" alt="Avatar de AXA" class="avatar">
      <div>
        <h1>AXA</h1>
        <p class="statut">En ligne</p>
      </div>
    </header>

    <ul class="capacites">
      <li>Horaires</li>
      <li>Contrats</li>
      <li>Sinistres</li>
      <li>Devis</li>
    </ul>

    <section class="messages">
      <p class="message bot">Bonjour ! Comment puis-je vous aider ?</p>
      <p class="message user">Quels sont vos horaires ?</p>
      <p class="message bot">Du lundi au samedi, de 9h à 18h.</p>
    </section>

    <form class="chat-form" action="#">
      <label for="message">Votre message</label>
      <input type="text" id="message" placeholder="Écrivez votre message...">
      <button type="submit">Envoyer</button>
    </form>
  </main>
</body>
</html>
